name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: sh tests/run.sh

      - name: Build .deb
        run: |
          version="${GITHUB_REF_NAME#v}"
          sh packaging/debian/build-deb.sh "$version"

      - name: Upload .deb to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber
